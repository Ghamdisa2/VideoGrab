name: Build VideoGrab
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: VideoGrab-Android-APK, path: android/app/build/outputs/apk/debug/*.apk }
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
        working-directory: desktop
      - run: python build.py
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: 'VideoGrab-${{ matrix.os }}', path: desktop/dist/* }
